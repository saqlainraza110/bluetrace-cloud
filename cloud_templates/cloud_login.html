<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Cloud Storage - Login</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1a237e, #0d47a1, #01579b);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-card {
    background: white;
    border-radius: 16px;
    padding: 45px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.company-logo {
    text-align: center;
    margin-bottom: 30px;
}

.company-logo .icon {
    font-size: 50px;
    margin-bottom: 10px;
}

.company-logo h1 {
    color: #1a237e;
    font-size: 20px;
    margin-bottom: 4px;
}

.company-logo p {
    color: #888;
    font-size: 13px;
}

.ip-badge {
    background: #f5f5f5;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 8px 12px;
    margin-bottom: 20px;
    font-size: 11px;
    color: #666;
    text-align: center;
}

.ip-badge span {
    color: #e65100;
    font-weight: bold;
}

.error-box {
    background: #ffebee;
    border: 1px solid #ef9a9a;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 20px;
    color: #c62828;
    font-size: 13px;
    text-align: center;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    color: #333;
    transition: border-color 0.2s;
}

input:focus {
    outline: none;
    border-color: #1a237e;
    box-shadow: 0 0 0 3px rgba(26,35,126,0.1);
}

.login-btn {
    width: 100%;
    padding: 13px;
    background: #1a237e;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
}

.login-btn:hover {
    background: #283593;
}

.warning-text {
    text-align: center;
    font-size: 11px;
    color: #999;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #eee;
}

.company-info {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #f0f0f0;
}

.info-item {
    text-align: center;
}

.info-item .num {
    font-size: 18px;
    font-weight: bold;
    color: #1a237e;
}

.info-item .lbl {
    font-size: 10px;
    color: #999;
}
</style>
</head>
<body>

<div class="login-card">

    <div class="company-logo">
        <div class="icon">☁️</div>
        <h1>SecureCloud Enterprise</h1>
        <p>Company Cloud Storage System</p>
    </div>

    <div class="ip-badge">
        Your IP: <span>{{ ip }}</span> — All access is monitored
    </div>

    {% if error %}
    <div class="error-box">
        ⚠️ {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
        <div class="form-group">
            <label>Employee Username</label>
            <input
                type="text"
                name="username"
                placeholder="e.g. john.doe"
                required
                autocomplete="off"
            >
        </div>
        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >
        </div>
        <button type="submit" class="login-btn">
            Sign In to Cloud Storage
        </button>
    </form>

    <div class="company-info">
        <div class="info-item">
            <div class="num">2.5TB</div>
            <div class="lbl">Storage</div>
        </div>
        <div class="info-item">
            <div class="num">156</div>
            <div class="lbl">Files</div>
        </div>
        <div class="info-item">
            <div class="num">24/7</div>
            <div class="lbl">Monitored</div>
        </div>
    </div>

    <div class="warning-text">
        Unauthorized access is strictly prohibited and monitored.
    </div>

</div>

</body>
</html>
