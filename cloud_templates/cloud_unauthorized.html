<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Denied - SecureCloud</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}
.box {
    background: white;
    border-radius: 12px;
    padding: 40px;
    max-width: 450px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}
.icon { font-size: 60px; margin-bottom: 20px; }
h1 { color: #c62828; font-size: 24px; margin-bottom: 10px; }
p { color: #666; font-size: 14px; margin-bottom: 15px; line-height: 1.6; }
.ip-box { background: #ffebee; border-radius: 8px; padding: 15px; margin: 20px 0; }
.ip-label { font-size: 12px; color: #999; margin-bottom: 5px; }
.ip-value { font-size: 20px; color: #c62828; font-weight: bold; }
a { display: inline-block; margin-top: 20px; color: #1a237e; text-decoration: none; font-weight: bold; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="box">
    <div class="icon">⛔</div>
    <h1>Access Denied</h1>
    <p>You do not have permission to access this resource.</p>
    <div class="ip-box">
        <div class="ip-label">Your IP Address:</div>
        <div class="ip-value">{{ ip }}</div>
    </div>
    <p style="font-size: 13px; color: #999;">This attempt has been logged and reported to the security team.</p>
    <a href="/login">← Back to Login</a>
</div>
</body>
</html>
