<!DOCTYPE html>
<html>
<head>
    <title>Cloud Security - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0d0d1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: #16213e;
            border: 1px solid #00ff88;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #00ff88;
            font-size: 20px;
        }

        .logo p {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }

        .ip-info {
            background: #0f1a2e;
            border: 1px solid #0f3460;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 11px;
            color: #888;
            text-align: center;
        }

        .ip-info span {
            color: #ff8800;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #888;
            font-size: 12px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #0d0d1a;
            border: 1px solid #0f3460;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }

        input:focus {
            outline: none;
            border-color: #00ff88;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }

        .login-btn:hover {
            background: #00cc66;
        }

        .error-box {
            background: #330000;
            border: 1px solid #ff4444;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            color: #ff6666;
            font-size: 12px;
            text-align: center;
        }

        .warning-box {
            background: #1a1000;
            border: 1px solid #ff8800;
            border-radius: 6px;
            padding: 10px;
            margin-top: 20px;
            color: #ff8800;
            font-size: 11px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-container">

    <div class="logo">
        <h1>🛡️ Cloud Security System</h1>
        <p>Secure Cloud Storage Access Portal</p>
    </div>

    <div class="ip-info">
        Your IP Address: <span>{{ ip }}</span>
        <br>
        This IP is being monitored and logged
    </div>

    {% if error %}
    <div class="error-box">
        ⚠️ {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">

        <div class="form-group">
            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
                autocomplete="off"
            >
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >
        </div>

        <button type="submit" class="login-btn">
            🔐 LOGIN TO CLOUD SYSTEM
        </button>

    </form>

    <div class="warning-box">
        ⚠️ WARNING: All login attempts are recorded.<br>
        {{ max_attempts }} failed attempts will block your IP permanently.
    </div>

</div>

</body>
</html>
