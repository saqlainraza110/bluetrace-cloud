<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Security Tool - Admin Login</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Courier New', monospace;
    background: #0d0d1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}
.card {
    background: #16213e;
    border: 1px solid #00ff88;
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
}
.logo {
    text-align: center;
    margin-bottom: 30px;
}
.logo h1 { color: #00ff88; font-size: 20px; }
.logo p { color: #888; font-size: 12px; margin-top: 5px; }
.form-group { margin-bottom: 18px; }
label { display: block; color: #888; font-size: 12px; margin-bottom: 6px; }
input {
    width: 100%;
    padding: 12px;
    background: #0d0d1a;
    border: 1px solid #0f3460;
    border-radius: 6px;
    color: white;
    font-size: 14px;
    font-family: 'Courier New', monospace;
}
input:focus { outline: none; border-color: #00ff88; }
.btn {
    width: 100%;
    padding: 13px;
    background: #00ff88;
    color: black;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    font-family: 'Courier New', monospace;
}
.btn:hover { background: #00cc66; }
.error {
    background: #330000;
    border: 1px solid #ff4444;
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 15px;
    color: #ff6666;
    font-size: 12px;
    text-align: center;
}
.note {
    text-align: center;
    margin-top: 20px;
    font-size: 11px;
    color: #444;
    border-top: 1px solid #1a2a4a;
    padding-top: 15px;
}
.creds {
    background: #0f1a2e;
    border-radius: 6px;
    padding: 12px;
    margin-top: 15px;
    font-size: 11px;
    color: #666;
}
.creds p { margin-bottom: 4px; }
.creds span { color: #00ff88; }
</style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>🛡️ Security Monitoring Tool</h1>
        <p>Cloud Attack Detection & Forensics System</p>
    </div>

    {% if error %}
    <div class="error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label>Security Admin Username</label>
            <input type="text" name="username"
                   placeholder="Enter admin username"
                   required autocomplete="off">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn">
            🔐 Access Security Dashboard
        </button>
    </form>

    <div class="note">
        Authorized security personnel only
        
    </div>
</div>
</body>
</html>
